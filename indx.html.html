<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة ملاحظة الامتحانات - جامعة بنى سويف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f9f7;--fg:#14201a;--card:#fff;--mut:#eef3f0;--mf:#5b6b63;--bd:#dbe5df;--pri:#2a7f5f;--prf:#fff;--acc:#e3f2ec;--dst:#c0392b;--c2:#d9a441;--warn:#e67e22;--ok:#27ae60;}
.dark{--bg:#111815;--fg:#eaf1ed;--card:#18221e;--mut:#212d27;--mf:#9fb1a8;--bd:#2b3a33;--pri:#3aa57e;--prf:#0f1613;--acc:#243a31;--dst:#e57366;--c2:#e0b45a;--warn:#f39c12;--ok:#2ecc71;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Cairo","Tajawal",Arial,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
header{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.logo{width:38px;height:38px;border-radius:9px;background:var(--pri);color:var(--prf);display:flex;align-items:center;justify-content:center;font-size:20px}
.ht1{font-weight:700;font-size:15px;line-height:1.2}.ht2{font-size:11px;color:var(--mf)}
.sp{margin-right:auto;display:flex;gap:8px;align-items:center}
.tag{background:var(--mut);padding:3px 9px;border-radius:6px;font-size:12px;color:var(--mf)}
.tag.admin{background:var(--c2);color:#fff;font-weight:600}
.tag.user{background:var(--mut);color:var(--mf)}
.layout{display:flex;flex:1;min-height:0}
aside{width:250px;flex-shrink:0;background:var(--card);border-left:1px solid var(--bd);padding:10px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.nb{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:9px 10px;border:0;background:none;border-radius:9px;cursor:pointer;margin-bottom:3px}
.nb:hover{background:var(--acc)}.nb.on{background:var(--pri);color:var(--prf)}
.nb .ic{font-size:18px;width:24px;text-align:center}.nb b{display:block;font-size:13.5px;font-weight:600}.nb small{display:block;font-size:11px;opacity:.7}
main{flex:1;min-width:0;padding:20px;max-width:1300px;margin:0 auto;width:100%}
footer{border-top:1px solid var(--bd);background:var(--card);padding:10px 16px;font-size:12px;color:var(--mf);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
h2.pt{font-size:19px;margin-bottom:2px}.pd{color:var(--mf);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{font-size:16px}.muted{color:var(--mf)}.c{text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:var(--card);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--acc)}.btn.pri{background:var(--pri);color:var(--prf);border-color:var(--pri)}.btn.pri:hover{opacity:.9}
.btn.dng{color:var(--dst)}.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
.ib{border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:14px}.ib:hover{background:var(--mut)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=text],input[type=number],input[type=date],select,textarea,input:not([type]){background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%}
.toolbar input{flex:1;min-width:200px}.toolbar select{width:auto;min-width:130px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:9px;max-height:62vh}
table{width:100%;border-collapse:collapse}
th{background:var(--mut);padding:8px;text-align:right;font-size:12.5px;position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--bd);vertical-align:middle}
tr:hover td{background:color-mix(in srgb,var(--acc) 40%,transparent)}
td.num{text-align:left;direction:ltr;white-space:nowrap}.ltr{direction:ltr;text-align:right;white-space:nowrap;font-size:12px}
.acts{white-space:nowrap;width:1%}
th[data-sort]{cursor:pointer;user-select:none}th[data-sort]:hover{background:var(--acc)}.sort-ind{font-size:10px;opacity:.7;margin-inline-start:3px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;background:var(--mut);border:1px solid var(--bd)}
.badge.p{background:var(--pri);color:var(--prf);border-color:var(--pri)}.badge.d{background:var(--dst);color:#fff;border-color:var(--dst)}.badge.w{background:var(--warn);color:#fff;border-color:var(--warn)}
.grp{border:1px solid var(--bd);border-radius:10px;margin-bottom:14px;overflow:hidden}
.grp-h{display:flex;justify-content:space-between;background:var(--mut);padding:8px 14px;flex-wrap:wrap;gap:6px}
.grp .tw{border:0;border-radius:0;max-height:none}
.sum{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;background:var(--acc);border-radius:9px;font-size:13px}
.sum b{color:var(--pri)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.stat .t{font-size:12.5px;color:var(--mf);display:flex;justify-content:space-between}.stat .v{font-size:23px;font-weight:800;margin-top:4px;direction:ltr;text-align:right}.stat .s{font-size:11.5px;color:var(--mf)}
.hb{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}.hl{width:110px;flex-shrink:0}.ht{flex:1;background:var(--mut);height:14px;border-radius:7px;overflow:hidden}.hf{height:100%;background:var(--pri);border-radius:7px}.hv{width:75px;text-align:left;direction:ltr;font-weight:600}
.vc{display:flex;gap:6px;align-items:flex-end;height:220px;overflow-x:auto;padding-bottom:4px}.vcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:34px;height:100%;justify-content:flex-end}
.vb{display:flex;gap:2px;align-items:flex-end;height:calc(100% - 18px)}.vb i{display:block;width:12px;border-radius:3px 3px 0 0;min-height:2px}.b1{background:var(--pri)}.b2{background:var(--c2)}
.lg{display:flex;gap:14px;font-size:12px;margin-top:6px}.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;background:var(--pri)}.lg span+span:before{background:var(--c2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px}
.md{background:var(--card);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:760px;padding:18px}
.md.w{max-width:1150px}.md.h h3{font-size:17px}.md .dsc{color:var(--mf);font-size:12.5px;margin-bottom:14px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.fg .full{grid-column:1/-1}
.fg label.l{display:block;font-size:12.5px;margin-bottom:4px;font-weight:600}.chk{display:flex;gap:7px;align-items:center;cursor:pointer;padding-top:20px}.chk input{width:auto}
.ro{background:var(--mut);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font-weight:700;direction:ltr;text-align:center}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{padding:8px 16px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;font-weight:600}.tabs button.on{background:var(--pri);color:var(--prf);border-color:var(--pri)}
details.dd{position:relative}details.dd summary{list-style:none;cursor:pointer}details.dd summary::-webkit-details-marker{display:none}
.ddm{position:absolute;left:0;top:110%;background:var(--card);border:1px solid var(--bd);border-radius:9px;min-width:190px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:4px}
.ddm button{display:block;width:100%;text-align:right;padding:8px 10px;border:0;background:none;cursor:pointer;border-radius:6px}.ddm button:hover{background:var(--acc)}
.etab{width:100%;font-size:12px}.etab input,.etab select{padding:4px 6px;font-size:12px}.etab td{padding:3px}.etab td.cv{text-align:center;font-weight:700;color:var(--pri);direction:ltr}
#toast{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.ti{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25)}.ti.e{background:var(--dst);color:#fff}.ti.w{background:var(--warn);color:#fff}.ti.ok{background:var(--ok);color:#fff}
.menu-btn{display:none}
/* New styles for import review, error highlighting, management */
.imp-review{overflow:auto;max-height:50vh;border:1px solid var(--bd);border-radius:9px}
.imp-review table{font-size:12px}
.imp-review th{position:sticky;top:0;z-index:2;background:var(--mut);font-size:11.5px}
.imp-review td.err{background:rgba(192,57,43,.12)!important}
.imp-review td.warn-c{background:rgba(230,126,34,.12)!important}
.imp-review input,.imp-review select{padding:3px 5px;font-size:12px;border-radius:4px}
.err-msg{color:var(--dst);font-size:11.5px;margin-top:2px}
.warn-msg{color:var(--warn);font-size:11.5px;margin-top:2px}
.mgr-card{border:1px solid var(--bd);border-radius:9px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mgr-card .info{flex:1;min-width:200px}
.mgr-card .info b{display:block;font-size:14px}
.mgr-card .info small{color:var(--mf);font-size:12px}
.mgr-card .acts2{display:flex;gap:4px;flex-wrap:wrap}
.stat-banner{padding:10px 14px;border-radius:9px;margin-bottom:12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.stat-banner.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);border:1px solid var(--ok)}
.stat-banner.err{background:color-mix(in srgb,var(--dst) 15%,transparent);border:1px solid var(--dst)}
.stat-banner.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);border:1px solid var(--warn)}
.field-row{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.field-row .fr-key{font-family:monospace;font-size:11px;background:var(--mut);padding:2px 6px;border-radius:4px;direction:ltr}
.field-row .fr-label{font-weight:600;flex:1;min-width:120px}
.field-row .fr-type{font-size:11px;color:var(--mf);background:var(--acc);padding:2px 8px;border-radius:99px}
.perm-gate{padding:20px;text-align:center}
.perm-gate .ico{font-size:48px;margin-bottom:10px}
.perm-gate input{max-width:240px;margin:10px auto}
.cat-color-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:6px;vertical-align:middle}
.drop-zone{border:2px dashed var(--bd);border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:.2s}
.drop-zone:hover,.drop-zone.drag{border-color:var(--pri);background:var(--acc)}
.drop-zone .ico{font-size:36px;margin-bottom:8px}
@media(max-width:900px){.menu-btn{display:inline-flex}aside{position:fixed;right:0;top:60px;z-index:35;transform:translateX(100%);transition:.2s}aside.open{transform:none}.hl{width:80px}}
.totals-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
.totals-card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center;cursor:pointer;transition:.2s}
.totals-card:hover{border-color:var(--pri);background:var(--acc)}
.totals-card .tc-label{font-size:12px;color:var(--mf);margin-bottom:4px}
.totals-card .tc-value{font-size:20px;font-weight:800;color:var(--pri);direction:ltr}
.totals-card .tc-count{font-size:11px;color:var(--mf);margin-top:2px}
.totals-card.grand{grid-column:1/-1;background:var(--pri);color:var(--prf);border-color:var(--pri)}
.totals-card.grand .tc-label{color:var(--prf);opacity:.9}
.totals-card.grand .tc-value{color:var(--prf);font-size:28px}
.totals-card.grand .tc-count{color:var(--prf);opacity:.8}
.totals-card.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
/* Flexible list manager (periods/locations) */
.flex-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sg-row{display:grid;grid-template-columns:auto 1.2fr 1.2fr 1fr auto auto;gap:6px;align-items:center;background:var(--mut);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}.sg-row input[type=text],.sg-row select{width:100%}.sg-row label.ck{display:flex;gap:4px;align-items:center;font-size:11px;white-space:nowrap}
.sg-prev{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.sg-prev .sg-slot{min-height:78px;border:1px dashed var(--bd);border-radius:8px;padding:4px;text-align:center;font-size:11px;color:var(--mf);display:flex;flex-direction:column;justify-content:flex-end;gap:2px}.sg-prev .sg-slot .ln{border-top:1px dashed var(--bd);margin-top:6px;padding-top:2px;font-size:10px}
@media(max-width:820px){.sg-row{grid-template-columns:1fr 1fr}}
.flex-list .fl-row{display:flex;gap:6px;align-items:center;background:var(--mut);border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
.flex-list .fl-row .fl-i{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;font-size:13px}
.flex-list .fl-row .fl-i:focus{outline:2px solid var(--pri);outline-offset:-1px}
.flex-list .fl-row .fl-idx{font-size:11px;color:var(--mf);min-width:22px;text-align:center}
.fl-add{display:flex;gap:6px;margin-top:6px}
.fl-add input{flex:1}
.logo-uploader{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:10px}
.logo-card{border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center;background:var(--card)}
.logo-card .lc-preview{width:96px;height:96px;margin:0 auto 8px;border:1px dashed var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--mut);overflow:hidden}
.logo-card .lc-preview img{max-width:100%;max-height:100%;object-fit:contain}
.logo-card .lc-preview .ph{font-size:11px;color:var(--mf)}
.logo-card .lc-label{font-weight:600;font-size:13px;margin-bottom:6px}
.logo-card .lc-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.logo-pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.logo-pos-opt{border:2px solid var(--bd);border-radius:8px;padding:8px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;background:var(--card)}
.logo-pos-opt.on{border-color:var(--pri);background:var(--acc);color:var(--pri)}
.logo-pos-opt .lp-mini{display:flex;justify-content:space-between;align-items:center;height:24px;background:var(--mut);border-radius:4px;padding:0 4px;margin-bottom:4px}
.logo-pos-opt .lp-mini .lp-dot{width:8px;height:8px;border-radius:50%;background:var(--pri)}
.logo-pos-opt .lp-mini .lp-line{flex:1;height:3px;background:var(--bd);margin:0 4px;border-radius:2px}
</style>
</head>
<body>
<header>
  <button class="btn menu-btn" id="menuBtn">☰</button>
  <div class="logo" id="appLogo">🎓</div>
  <div><div class="ht1">نظام إدارة ملاحظة الامتحانات</div><div class="ht2" id="hSub"></div></div>
  <div class="sp"><span class="tag" id="hTerm"></span><button class="tag user" id="roleBtn" title="تبديل الصلاحية">👤 مستخدم</button><button class="btn" id="themeBtn" title="تبديل المظهر">🌙</button></div>
</header>
<div class="layout"><aside id="nav"></aside><main id="main"></main></div>
<footer id="foot"></footer>
<div id="mroot"></div><div id="toast"></div>
<input type="file" id="fileInput" hidden>

<script>
'use strict';
/* ================= أدوات عامة ================= */
const KEY='examSystem_v2',THEME='examSystem_theme';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('ar-EG',{maximumFractionDigits:2});
const fN=n=>nf.format(Number(n)||0),fD=d=>d?String(d).slice(0,10):'',num=v=>Number(v)||0;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const txt=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.trim()};
const oa=o=>Array.isArray(o)?o.map(x=>[x,x]):Object.entries(o);
const badge=(t,c='')=>`<span class="badge ${c}">${esc(t)}</span>`;
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const COM={higher:'اللجنة العليا',preliminary:'اللجنة التمهيدية',control_1:'كنترول المستوى الأول',control_2:'كنترول المستوى الثاني',control_3:'كنترول المستوى الثالث',control_4:'كنترول المستوى الرابع'};
const COM_ORDER=Object.keys(COM);
const STAGES=['بكالوريوس','دراسات عليا'];
const JOBS=['أمن','عامل','أهلية','شئون طلاب','تجارة','معيد','مدرس مساعد','ممرضه','اجازه','نائب'];

/* ================= أنواع اللجان الديناميكية ================= */
const DEF_COM_TYPES=[
  {key:'higher',label:'اللجنة العليا',isCommittee:true,protected:true,color:'#e74c3c'},
  {key:'preliminary',label:'اللجنة التمهيدية',isCommittee:true,protected:true,color:'#e67e22'},
  {key:'control_1',label:'كنترول المستوى الأول',isCommittee:true,protected:true,color:'#2a7f5f'},
  {key:'control_2',label:'كنترول المستوى الثاني',isCommittee:true,protected:true,color:'#2a7f5f'},
  {key:'control_3',label:'كنترول المستوى الثالث',isCommittee:true,protected:true,color:'#2a7f5f'},
  {key:'control_4',label:'كنترول المستوى الرابع',isCommittee:true,protected:true,color:'#2a7f5f'},
  {key:'workers',label:'العمال',isCommittee:false,protected:true,color:'#3498db'},
  {key:'6percent',label:'فئة 6%',isCommittee:false,protected:true,color:'#9b59b6'},
  {key:'9percent',label:'فئة 9%',isCommittee:false,protected:true,color:'#f39c12'}
];
const comTypesArr=()=>S.committeeTypes||DEF_COM_TYPES;
const comTypeLabel=k=>{const t=comTypesArr().find(x=>x.key===k);return t?t.label:k};
const comTypeObj=k=>comTypesArr().find(x=>x.key===k)||{label:k,isCommittee:true,color:'#2a7f5f'};
const comTypeColor=k=>{const t=comTypeObj(k);return t.color||'#2a7f5f'};
const comTypeIsCommittee=k=>{const t=comTypeObj(k);return t.isCommittee!==false};
const comTypeOrder=()=>comTypesArr().map(t=>t.key);
const comTypeMap=()=>Object.fromEntries(comTypesArr().map(t=>[t.key,t.label]));

/* ================= الفئات والحقول الافتراضية الديناميكية ================= */
const DEF_CATS=[
  {key:'general',label:'القسم العام',rateType:'committee',rate:100,protected:true,color:'#2a7f5f'},
  {key:'assistant',label:'الهيئة المعاونة',rateType:'committee',rate:100,color:'#3498db'},
  {key:'6percent',label:'فئة 6%',rateType:'percentage',rate:6,color:'#9b59b6'},
  {key:'9percent',label:'فئة 9%',rateType:'percentage',rate:9,color:'#e67e22'},
  {key:'workers',label:'العمال',rateType:'day',rate:75,protected:true,color:'#e74c3c'}
];

  {key:'name',label:'الاسم الكامل',type:'text',required:true,full:true,showInTable:true,inForm:true,protected:true},

const catArr=()=>S.observerCategories||DEF_CATS;
const catMap=()=>Object.fromEntries(catArr().map(c=>[c.key,c.label]));
const catOrder=()=>catArr().map(c=>c.key);
const catLabel=k=>{const c=catArr().find(x=>x.key===k);return c?c.label:k};
const catObj=k=>catArr().find(x=>x.key===k)||{label:k,rateType:'committee',rate:0};
const catColor=k=>{const c=catObj(k);return c.color||'#2a7f5f'};
const fieldArr=()=>S.observerFields||DEF_FIELDS;
const formFields=()=>fieldArr().filter(f=>f.inForm!==false).map(f=>{
  const o={k:f.key,label:f.label,req:f.required,full:f.full,def:f.def};
  if(f.type==='category'){o.t='select';o.opts=catMap();if(!f.required)o.blank=true}
  else if(f.type==='select'){o.t='select';o.opts=f.options||[];if(!f.required)o.blank=true}
  else if(f.type==='check'){o.t='check'}
  else if(f.type==='textarea'){o.t='textarea'}
  else if(f.type==='calculated'){o.t='ro'}
  else{o.t=f.type==='number'?'number':f.type==='date'?'date':'text'}
  if(f.suggest){
    if(f.suggestSource==='periods')o.list=S.settings.periods||[];
    else if(f.suggestSource==='jobs')o.list=[...new Set([...JOBS,...(S.observers||[]).map(x=>x[f.key]).filter(Boolean)])];
    else o.list=[...new Set((S.observers||[]).map(x=>x[f.key]).filter(Boolean))];
  }
  return o;
});
const tableCols=()=>fieldArr().filter(f=>f.showInTable).map(f=>{
  const cls=f.type==='number'||f.type==='calculated'?'num':f.key==='nationalId'||f.key==='phone'?'ltr muted':'';
  let fn;
  if(f.key==='name')fn=r=>`<b>${esc(r.name||'')}</b>`;
  else if(f.type==='category')fn=r=>`<span class="badge" style="background:${catColor(r.category)}20;border-color:${catColor(r.category)};color:${catColor(r.category)}">${esc(catLabel(r.category))}</span>`;
  else if(f.type==='calculated')fn=r=>`<b>${fN(calcFieldValue(f,r))}</b>`;
  else if(f.type==='number')fn=r=>fN(r[f.key]);
  else fn=r=>esc(r[f.key]||'-');
  return {l:f.label,f:fn,cls};
});
const calcFieldValue=(f,r)=>{
  if(f.type!=='calculated')return num(r[f.key]);
  if(f.calc==='sum')return (f.calcFields||[]).reduce((s,k)=>s+num(r[k]),0);
  if(f.calc==='multiply'&&f.calcFields&&f.calcFields.length===2)return num(r[f.calcFields[0]])*num(r[f.calcFields[1]]);
  return num(r[f.key]);
};
const calcObserverTotal=o=>{
  fieldArr().filter(f=>f.type==='calculated').forEach(f=>{o[f.key]=calcFieldValue(f,o)});
};

let S=null;
function load(){
  // Try v2 first
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      S=JSON.parse(r);
      S.settings={...DEF_SETTINGS,...S.settings};
      // migration: add categories/fields if missing
      if(!S.observerCategories||!Array.isArray(S.observerCategories)||!S.observerCategories.length)S.observerCategories=JSON.parse(JSON.stringify(DEF_CATS));
      if(!S.observerFields||!Array.isArray(S.observerFields)||!S.observerFields.length)S.observerFields=JSON.parse(JSON.stringify(DEF_FIELDS));
      // migration: add committee types if missing
      if(!S.committeeTypes||!Array.isArray(S.committeeTypes)||!S.committeeTypes.length)S.committeeTypes=JSON.parse(JSON.stringify(DEF_COM_TYPES));
      // ensure all observer fields exist on each record
      if(S.observers&&S.observers.length)S.observers.forEach(o=>{fieldArr().forEach(f=>{if(!(f.key in o))o[f.key]=f.type==='number'?0:f.type==='check'?false:''})});
      // ensure control records have committeeCount field
      if(S.control&&S.control.length)S.control.forEach(c=>{if(!('committeeCount'in c))c.committeeCount=0});
      // migration: add audit log if missing
      if(!S.auditLog||!Array.isArray(S.auditLog))S.auditLog=[];
      return;
    }
  }catch(e){}
  // Try migrating from v1 key
  try{
    const old=localStorage.getItem('examSystem_v1');
    if(old){
      const o=JSON.parse(old);
      if(o&&(o.observers||o.control||o.settings)){
        S={
          settings:{...DEF_SETTINGS,...(o.settings||{})},
          observerCategories:JSON.parse(JSON.stringify(DEF_CATS)),
          observerFields:JSON.parse(JSON.stringify(DEF_FIELDS)),
          committeeTypes:JSON.parse(JSON.stringify(DEF_COM_TYPES)),
          auditLog:[],
          observers:o.observers||[],
          subjects:o.subjects||[],
          committees:o.committees||[],
          control:(o.control||[]).map(c=>{if(!('committeeCount'in c))c.committeeCount=0;return c}),
          accounts:o.accounts||[],
          dues:o.dues||[],
          dailyReports:o.dailyReports||[],
          workReports:o.workReports||[]
        };
        // ensure all observer fields exist
        S.observers.forEach(ob=>{fieldArr().forEach(f=>{if(!(f.key in ob))ob[f.key]=f.type==='number'?0:f.type==='check'?false:''})});
        persist();
        setTimeout(()=>toast('تم ترحيل البيانات من النسخة السابقة بنجاح','ok'),500);
        return;
      }
    }
  }catch(e){}
  S=seedData();persist();
}

function logAction(action,section,details,itemId){
  const entry={
    id:uid(),
    action, // 'add','edit','delete','import','distribute','export','settings'
    section, // 'observers','dues','control',...
    details:details||'',
    itemId:itemId||'',

    timestamp:new Date().toISOString(),
    date:new Date().toLocaleDateString('ar-EG'),
    time:new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})

  if(!S.auditLog)S.auditLog=[];
  S.auditLog.unshift(entry); // newest first
  // keep max 500 entries
  if(S.auditLog.length>500)S.auditLog=S.auditLog.slice(0,500);

}

  box.innerHTML=`<div class="card"><div class="card-h"><div><h3>📜 سجل التعديلات</h3><div class="muted">تتبع جميع عمليات الإضافة والتعديل والحذف والاستيراد والتوزيع</div></div><div class="row"><button class="btn dng sm" id="clrLog">🧹 مسح السجل</button></div></div>

   </div><div id="tbl"></div></div>`;

    }

    const data=[['م',...d.columns],...d.rows.map((r,i)=>[i+1,...r])];
    if(d.summary&&d.summary.length){data.push([]);data.push(['الملخص']);d.summary.forEach(s=>data.push([s.label,s.value]))}

  }
}

   <div class="toolbar">${cfg.searchKeys?`<input id="q" placeholder="${cfg.ph||'بحث...'}" value="${esc(ui.q)}">`:''}${(cfg.filters||[]).map(f=>{if(f.type==='date')return`<input type="date" data-f="${f.id}" style="max-width:165px" value="${esc(ui.f[f.id]||'')}" title="${esc(f.label)}">`;if(f.type==='text')return`<input type="text" data-f="${f.id}" style="max-width:150px" value="${esc(ui.f[f.id]||'')}" placeholder="${esc(f.label)}">`;return`<select data-f="${f.id}"><option value="">${f.label}</option>${oa(typeof f.opts==='function'?f.opts():f.opts).map(([a,b])=>`<option value="${esc(a)}" ${ui.f[f.id]===a?'selected':''}>${esc(b)}</option>`).join('')}</select>`}).join('')}${cfg.dateFilter?`<input type="date" data-f="date" style="max-width:170px" value="${esc(ui.f.date||'')}">`:''}${cfg.sortable?'<span class="muted" style="font-size:11px;align-self:center">💡 اضغط على عنوان العمود للترتيب</span>':''}</div><div id="tbl"></div></div>`;
  const rowsNow=()=>{
    let r=S[cfg.key].filter(x=>{
      if(cfg.baseFilter&&!cfg.baseFilter(x))return false;

    else if(cfg.sort)r=[...r].sort(cfg.sort);return r;
  };
  const acts=r=>`${(cfg.actions||[]).map(a=>`<button class="ib" data-a="${a.act}" data-id="${r.id}" title="${a.t}">${a.i}</button>`).join('')}<button class="ib" data-a="edit" data-id="${r.id}" title="تعديل">✏️</button><button class="ib" data-a="del" data-id="${r.id}" title="حذف">🗑️</button>`;
  const colsArr=()=>dyn(cfg.cols);
  const tbl=rows=>{const cols=colsArr();const sortInd=c=>{if(!cfg.sortable||!c.key||!ui.sort||ui.sort.key!==c.key)return'';return`<span class="sort-ind">${ui.sort.dir==='asc'?'▲':'▼'}</span>`};const sortAttr=c=>(cfg.sortable&&c.key)?`data-sort="${esc(c.key)}"`:'';return`<div class="tw"><table><thead><tr><th>م</th>${cols.map(c=>`<th ${sortAttr(c)}>${c.l}${sortInd(c)}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="muted ltr">${i+1}</td>${cols.map(c=>`<td class="${c.cls||''}">${c.f(r)}</td>`).join('')}<td class="acts">${acts(r)}</td></tr>`).join('')}</tbody></table></div>`};
  const draw=()=>{
    // Refresh dynamic filter options
    (cfg.filters||[]).forEach(f=>{
      if(f.type==='date'||f.type==='text')return;
      if(typeof f.opts==='function'){
        const sel=$(`select[data-f="${f.id}"]`,box);
        if(sel){
          const cur=sel.value;
          const opts=oa(f.opts());
          sel.innerHTML=`<option value="">${f.label}</option>${opts.map(([a,b])=>`<option value="${esc(a)}" ${cur===a?'selected':''}>${esc(b)}</option>`).join('')}`;
        }
      }
    });
    const rows=rowsNow();let h='';
    if(!rows.length)h='<p class="muted c" style="padding:30px">لا توجد بيانات</p>';
    else if(cfg.group){const g=cfg.group;const order=typeof g.order==='function'?g.order():g.order;h=order.map(k=>{const l=rows.filter(r=>r[g.by]===k);if(!l.length)return'';return`<div class="grp"><div class="grp-h"><b>${badge(g.label(k))}${g.note?` <small class="muted">${g.note(k)}</small>`:''}</b><span class="muted">${g.sub(l)}</span></div>${tbl(l)}</div>`}).join('')}
    else h=tbl(rows);
    if(cfg.summary&&rows.length)h+=`<div class="sum">${cfg.summary(rows).map(s=>`<span>${s.label}: <b>${esc(s.value)}</b></span>`).join('')}</div>`;
    if(cfg.after)h+=cfg.after(rows);
    $('#tbl',box).innerHTML=h;
  };
  const exportData=()=>{let rows=rowsNow();if(cfg.group){const order=typeof cfg.group.order==='function'?cfg.group.order():cfg.group.order;rows=[...rows].sort((a,b)=>order.indexOf(a[cfg.group.by])-order.indexOf(b[cfg.group.by]))}
    const cols=colsArr();
    return{title:cfg.title,subtitle:cfg.subtitle||cfg.desc,columns:cols.map(c=>c.l),rows:rows.map(r=>cols.map(c=>txt(c.f(r)))),summary:cfg.summary?cfg.summary(rows):[]}};
  const form=(item)=>{
    const fields=dyn(cfg.fields);const m=openModal(item?cfg.editTitle:cfg.addLabel,cfg.formDesc||'');
    m.body.innerHTML=`<div class="fg">${fields.map(f=>fieldHTML(f,item?item[f.k]:undefined)).join('')}</div>`;
    m.foot.innerHTML='<button class="btn" data-c>إلغاء</button><button class="btn pri" data-s>حفظ</button>';
    const hook=ev=>cfg.onForm&&cfg.onForm(m.body,ev,!!item);hook(null);
    m.body.addEventListener('input',hook);m.body.addEventListener('change',hook);
    $('[data-c]',m.foot).onclick=closeModal;
    $('[data-s]',m.foot).onclick=()=>{
      const o=readForm(fields,m.body);
      for(const f of fields){if(f.req&&!o[f.k]){toast(`الحقل «${f.label}» مطلوب`,'e');return}}
      const err=cfg.validate&&cfg.validate(o,item);if(err){toast(err,'e');return}
      if(cfg.before)cfg.before(o);
      if(item){const oldName=item.observerName||item.name||item.courseName||item.date||'-';Object.assign(item,o);logAction('edit',cfg.key,`تعديل: ${oldName} → ${o.observerName||o.name||o.courseName||o.date||oldName}`,item.id)}
      else{o.id=uid();if('serial'in o&&!o.serial)o.serial=S[cfg.key].length+1;if(cfg.defaultType)o.committeeType=cfg.defaultType;S[cfg.key].push(o);logAction('add',cfg.key,`إضافة: ${o.observerName||o.name||o.courseName||o.date||'سجل جديد'}`,o.id)}
      persist();closeModal();toast(item?'تم التحديث':'تمت الإضافة');draw();
    };
  };
  const open=item=>cfg.customForm?cfg.customForm(item,draw):form(item);
  box.onclick=e=>{
    const th=e.target.closest('[data-sort]');if(th){const k=th.dataset.sort;if(!ui.sort||ui.sort.key!==k)ui.sort={key:k,dir:'asc'};else if(ui.sort.dir==='asc')ui.sort.dir='desc';else ui.sort=null;draw();return}
    const ce=e.target.closest('[data-ce]');if(ce){if(cfg.key==='control')exportControlCombined(ce.dataset.ce);ce.closest('details').open=false;return}
    const gt=e.target.closest('[data-goto]');if(gt){const t=gt.dataset.goto;if(t==='workers')go('workers');else if(t==='6percent')go('sixpercent');else if(t==='9percent')go('ninepercent');else if(t==='observers')go('observers');else if(t==='controls'||t==='preliminary'||t==='higher')go('control');return}
    const x=e.target.closest('[data-x]');if(x){if(cfg.customExport){cfg.customExport(x.dataset.x,rowsNow())}else{doExport(x.dataset.x,exportData())};x.closest('details').open=false;return}
    const eb=e.target.closest('[data-eb]');if(eb&&cfg.onExtra)cfg.onExtra(eb.dataset.eb,draw);
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,item=S[cfg.key].find(r=>r.id===b.dataset.id);
    if(a==='add')open(null);else if(a==='edit')open(item);
    else if(a==='del'){
      const doDelete=()=>{if(cfg.beforeDelete&&!cfg.beforeDelete(item))return;if(confirm('تأكيد الحذف؟')){const name=item.observerName||item.name||item.courseName||item.date||'-';S[cfg.key]=S[cfg.key].filter(r=>r.id!==item.id);logAction('delete',cfg.key,`حذف: ${name}`,item.id);persist();toast('تم الحذف');draw()}};
      if(cfg.adminDelete&&!isAdmin()){promptAdmin(doDelete,'الحذف يتطلب صلاحية مدير. أدخل كلمة المرور.');return}
      doDelete();
    }
    else{const ac=(cfg.actions||[]).find(z=>z.act===a);if(ac)ac.fn(item)}
  };
  $$('[data-f]',box).forEach(s=>s.addEventListener('input',()=>{ui.f[s.dataset.f]=s.value;draw()}));
  const q=$('#q',box);if(q)q.addEventListener('input',()=>{ui.q=q.value;draw()});
  draw();
}

/* ================= قالب Excel ================= */
function downloadExcelTemplate(){
  if(typeof XLSX==='undefined'){toast('مكتبة Excel غير محملة','e');return}
  const fields=fieldArr().filter(f=>f.inForm!==false&&f.type!=='calculated');
  const headers=fields.map(f=>f.label+(f.required?' *':''));
  const sampleRow=fields.map(f=>{
    if(f.type==='category')return catArr()[0]?catArr()[0].label:'';
    if(f.type==='select')return (f.options||[])[0]||'';
    if(f.type==='number')return 0;
    if(f.type==='date')return '2026-01-01';
    if(f.type==='check')return 'نعم';
    return '';
  });
  const notesRow=fields.map(f=>{
    let n='';
    if(f.required)n+='مطلوب. ';
    if(f.type==='category')n+='اختر من: '+catArr().map(c=>c.label).join(' | ');
    else if(f.type==='select')n+='اختر من: '+(f.options||[]).join(' | ');
    else if(f.type==='number')n+='رقم';
    else if(f.type==='date')n+='تاريخ (YYYY-MM-DD)';
    else if(f.type==='check')n+='نعم أو لا';
    else n+='نص';
    return n;
  });
  const aoa=[['قالب استيراد قاعدة بيانات الملاحظين'],[],headers,sampleRow,[],['ملاحظات الحقول:'],notesRow,[''],['التعليمات:','املأ البيانات في الصفوف ابتداءً من الصف الثالث. الأعمدة المطلوبة مميزة بـ *.'], ['','الرقم القومي يجب أن يكون فريدًا (غير مكرر).'], ['','الفئة المالية: '+catArr().map(c=>c.label).join('، ')]];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=fields.map(()=>({wch:22}));
  ws['!rtl']=true;
  // styling: merge title
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:headers.length-1}}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'قالب الملاحظين');
  XLSX.writeFile(wb,'قالب_استيراد_الملاحظين.xlsx');
  toast('تم تحميل القالب','ok');
}

/* ================= استيراد Excel ================= */
function importExcel(draw){
  const fi=$('#fileInput');
  fi.accept='.xlsx,.xls,.csv';
  fi.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;fi.value='';
    if(typeof XLSX==='undefined'){toast('مكتبة Excel غير محملة','e');return}
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){toast('الملف فارغ أو لا يحتوي على بيانات','e');return}
      // find header row (skip title rows)
      let headerIdx=0;
      for(let i=0;i<Math.min(5,rows.length);i++){
        if(rows[i].some(c=>String(c).includes('الاسم')||String(c).includes('الرقم القومي'))){headerIdx=i;break}
      }
      const headers=rows[headerIdx].map(h=>String(h).trim());
      const dataRows=rows.slice(headerIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
      const fields=fieldArr().filter(f=>f.inForm!==false&&f.type!=='calculated');
      // map headers to fields (strip asterisks and extra markers from headers)
      const cleanH=h=>String(h).replace(/\s*\*+\s*$/,'').replace(/^\s*\*+\s*/,'').trim();
      const mapping=[];

function reviewImport(parsed,fields,draw){
  const m=openModal('مراجعة البيانات المستوردة',`${parsed.length} صف. راجع الأخطاء ثم اضغط اعتماد.`,true);
  m.foot.innerHTML='<button class="btn" data-c>إلغاء</button><button class="btn pri" data-s>✓ اعتماد الاستيراد</button>';
  const existing=S.observers.map(o=>o.nationalId).filter(Boolean);
  const validate=()=>{
    let errCount=0,warnCount=0;
    const nidsInImport={};
    parsed.forEach(r=>{
      r._errors=[];r._warns=[];
      fields.forEach(f=>{
        if(f.required&&(r[f.key]===undefined||r[f.key]===''||r[f.key]===null))r._errors.push(`«${f.label}» مطلوب`);
      });
      if(r.nationalId){
        if(existing.includes(r.nationalId))r._errors.push('رقم قومي مسجل مسبقًا');
        if(nidsInImport[r.nationalId])r._errors.push('مكرر في الملف المستورد');
        nidsInImport[r.nationalId]=true;
      }
      if(r.category&&!catArr().some(c=>c.key===r.category))r._errors.push('فئة غير معروفة');
      if(!r.nationalId&&!r.name)r._errors.push('صف فارغ');
      if(r._errors.length)errCount++;
    });
    return{errCount,warnCount};
  };
  const render=()=>{
    const{errCount,warnCount}=validate();
    const bannerClass=errCount>0?'err':warnCount>0?'warn':'ok';
    const bannerIcon=errCount>0?'⚠️':warnCount>0?'ℹ️':'✅';
    const okRows=parsed.filter(r=>!r._errors.length).length;
    m.body.innerHTML=`<div class="stat-banner ${bannerClass}"><span><b>${bannerIcon}</b> ${parsed.length} صف • <b style="color:var(--ok)">${okRows}</b> صالح • <b style="color:var(--dst)">${errCount}</b> بخطأ</span>
      <span class="muted" style="font-size:11px">يمكنك تعديل الخلايا مباشرة ثم اعتماد الصفوف الصالحة فقط</span></div>

    <tbody>${parsed.map((r,i)=>`<tr>
      <td class="muted c">${i+1}</td>
      ${fields.map(f=>{
        let v=r[f.key]??'';
        const hasErr=r._errors.some(e=>e.includes(f.label));
        if(f.type==='category')return`<td class="${hasErr?'err':''}"><select data-r="${i}" data-k="${f.key}"><option value="">اختر</option>${catArr().map(c=>`<option value="${c.key}" ${c.key===v?'selected':''}>${esc(c.label)}</option>`).join('')}</select></td>`;
        if(f.type==='select')return`<td class="${hasErr?'err':''}"><select data-r="${i}" data-k="${f.key}"><option value="">اختر</option>${(f.options||[]).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></td>`;
        if(f.type==='check')return`<td class="${hasErr?'err':''} c"><input type="checkbox" data-r="${i}" data-k="${f.key}" ${v?'checked':''}></td>`;
        if(f.type==='number')return`<td class="${hasErr?'err':''}"><input type="number" step="any" data-r="${i}" data-k="${f.key}" value="${esc(v)}"></td>`;
        return`<td class="${hasErr?'err':''}"><input data-r="${i}" data-k="${f.key}" value="${esc(v)}"></td>`;
      }).join('')}
      <td>${r._errors.length?`<span class="err-msg">${r._errors.map(e=>esc(e)).join('<br>')}</span>`:'<span class="badge p">✓ صالح</span>'}</td>
    </tr>`).join('')}</tbody></table></div>`;
    // disable confirm if all have errors
    $('[data-s]',m.foot).disabled=(okRows===0);
    $('[data-s]',m.foot).textContent=`✓ اعتماد الاستيراد (${okRows} صف صالح)`;
  };
  m.body.addEventListener('input',e=>{
    const el=e.target;if(el.dataset.r===undefined)return;
    const r=parsed[+el.dataset.r],k=el.dataset.key,f=fields.find(x=>x.key===k);
    if(f.type==='number')r[k]=num(el.value);
    else if(f.type==='check')r[k]=el.checked;
    else r[k]=el.value.trim();
    render();
  });
  m.body.addEventListener('change',e=>{
    const el=e.target;if(el.dataset.r===undefined)return;
    render();
  });
  $('[data-c]',m.foot).onclick=closeModal;
  $('[data-s]',m.foot).onclick=()=>{
    const{errCount}=validate();
    const valid=parsed.filter(r=>!r._errors.length);
    if(!valid.length){toast('لا توجد صفوف صالحة للاستيراد','e');return}
    if(errCount>0&&!confirm(`سيتم استيراد ${valid.length} صف صالح وتجاهل ${errCount} صف بخطأ. متابعة؟`))return;
    let added=0;
    valid.forEach(r=>{
      const o={id:uid()};
      fields.forEach(f=>{o[f.key]=r[f.key]!==undefined?r[f.key]:(f.def||'')});

// Conflict detection: same person, same date, same period
function findCommitteeConflicts(rows, excludeItem){
  const conflicts=[];
  const map={};
  rows.forEach((r,i)=>{
    if(!r.observerName||!r.examDate||!r.period)return;
    if(excludeItem&&r===excludeItem)return;
    const key=`${r.observerName}||${fD(r.examDate)}||${r.period}`;
    if(!map[key])map[key]={rows:[],name:r.observerName,date:fD(r.examDate),period:r.period};
    map[key].rows.push({idx:i,row:r});
  });
  Object.values(map).forEach(g=>{
    if(g.rows.length>1){
      g.rows.forEach(x=>{
        x.row._conflict={
          name:g.name,
          date:g.date,
          period:g.period,
          locations:g.rows.map(r=>r.row.location||'غير محدد').join('، ')
        };
        conflicts.push(x);
      });
    }
  });
  return conflicts;
}
function checkCommitteeConflict(o, excludeItem){
  if(!o.observerName||!o.examDate||!o.period)return null;
  const conflict=S.committees.find(c=>
    c!==excludeItem&&
    c.observerName===o.observerName&&
    fD(c.examDate)===fD(o.examDate)&&
    c.period===o.period
  );
  if(conflict){
    return {
      name:o.observerName,
      date:fD(o.examDate),
      period:o.period,
      existingLocation:conflict.location||'غير محدد',
      existingStage:conflict.stage||'-',
      newLocation:o.location||'غير محدد'
    };
  }
  return null;
}

function reviewCommitteesImport(parsed,fields,draw){
  const m=openModal('مراجعة توزيع اللجان المستوردة',`${parsed.length} صف — سيتم فحص التعارضات تلقائيًا.`,true);
  m.foot.innerHTML='<button class="btn" data-c>إلغاء</button><button class="btn pri" data-s>✓ اعتماد الاستيراد</button>';
  const existing=S.committees;
  const validate=()=>{
    let errCount=0,conflictCount=0;
    const seen={};
    parsed.forEach(r=>{
      r._errors=[];r._conflicts=[];
      fields.forEach(f=>{
        if(f.req&&(r[f.k]===undefined||r[f.k]===''||r[f.k]===null))r._errors.push(`«${f.label}» مطلوب`);
      });
      if(!r.observerName&&!r.examDate)r._errors.push('صف فارغ');
      // Check conflict with existing data
      if(r.observerName&&r.examDate&&r.period){
        const exist=existing.find(c=>c.observerName===r.observerName&&fD(c.examDate)===fD(r.examDate)&&c.period===r.period);
        if(exist){
          r._errors.push(`تعارض: ${r.observerName} مُوزع بالفعل في ${fD(r.examDate)} - ${r.period} (لجنة: ${exist.location||'غير محدد'})`);
          conflictCount++;
        }
        // Check conflict within the import file itself
        const key=`${r.observerName}||${fD(r.examDate)}||${r.period}`;
        if(seen[key]){
          r._errors.push(`تعارض داخلي: نفس الشخص مكرر في نفس اليوم والفترة (صف ${seen[key]+1})`);
          conflictCount++;
        }else{
          seen[key]=r._idx;
        }
      }
      if(r._errors.length)errCount++;
    });
    return{errCount,conflictCount};
  };
  const render=()=>{
    const{errCount,conflictCount}=validate();
    const okRows=parsed.filter(r=>!r._errors.length).length;
    const bannerClass=errCount>0?'err':'ok';
    const bannerIcon=errCount>0?'⚠️':'✅';
    m.body.innerHTML=`<div class="stat-banner ${bannerClass}"><span><b>${bannerIcon}</b> ${parsed.length} صف • <b style="color:var(--ok)">${okRows}</b> صالح • <b style="color:var(--dst)">${errCount}</b> بخطأ${conflictCount>0?` (منها ${conflictCount} تعارض)`:''}</span>
      <span class="muted" style="font-size:11px">⚠️ التعارض: نفس الشخص في نفس اليوم والفترة. يمكنك تعديل الخلايا ثم اعتماد الصفوف الصالحة فقط</span></div>
    <div class="imp-review"><table><thead><tr><th>#</th>${fields.map(f=>`<th>${esc(f.label)}${f.req?' *':''}</th>`).join('')}<th>الحالة</th></tr></thead>
    <tbody>${parsed.map((r,i)=>{
      const hasConflict=r._errors.some(e=>e.includes('تعارض'));
      return`<tr>
      <td class="muted c">${i+1}</td>
      ${fields.map(f=>{
        let v=r[f.k]??'';
        const hasErr=r._errors.some(e=>e.includes(f.label));
        const errCls=hasErr?'err':(hasConflict&&f.k==='observerName'?'err':'');
        if(f.t==='select'){const opts=typeof f.opts==='function'?f.opts():f.opts||[];return`<td class="${errCls}"><select data-r="${i}" data-k="${f.k}"><option value="">اختر</option>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></td>`}
        if(f.t==='number')return`<td class="${errCls}"><input type="number" step="any" data-r="${i}" data-k="${f.k}" value="${esc(v)}"></td>`;
        if(f.t==='date')return`<td class="${errCls}"><input type="date" data-r="${i}" data-k="${f.k}" value="${esc(v)}"></td>`;
        return`<td class="${errCls}"><input data-r="${i}" data-k="${f.k}" value="${esc(v)}"></td>`;
      }).join('')}
      <td>${r._errors.length?`<span class="err-msg">${r._errors.map(e=>esc(e)).join('<br>')}</span>`:'<span class="badge p">✓ صالح</span>'}</td>
    </tr>`}).join('')}</tbody></table></div>`;
    $('[data-s]',m.foot).disabled=(okRows===0);
    $('[data-s]',m.foot).textContent=`✓ اعتماد الاستيراد (${okRows} صف صالح)`;
  };
  m.body.addEventListener('input',e=>{
    const el=e.target;if(el.dataset.r===undefined)return;
    const r=parsed[+el.dataset.r],k=el.dataset.key,f=fields.find(x=>x.k===k);
    if(f.t==='number')r[k]=num(el.value);
    else r[k]=el.value.trim();
    if(k==='examDate'&&el.value){try{const d=new Date(el.value+'T00:00:00');r.dayName=DAYS[d.getDay()]||''}catch(e){}}
    render();
  });
  m.body.addEventListener('change',e=>{
    const el=e.target;if(el.dataset.r===undefined)return;
    render();
  });
  $('[data-c]',m.foot).onclick=closeModal;
  $('[data-s]',m.foot).onclick=()=>{
    const{errCount}=validate();
    const valid=parsed.filter(r=>!r._errors.length);
    if(!valid.length){toast('لا توجد صفوف صالحة للاستيراد','e');return}
    if(errCount>0&&!confirm(`سيتم استيراد ${valid.length} صف صالح وتجاهل ${errCount} صف بخطأ/تعارض. متابعة؟`))return;
    let added=0;
    valid.forEach(r=>{
      const o={id:uid()};
      fields.forEach(f=>{o[f.k]=r[f.k]!==undefined?r[f.k]:''});
      if(o.examDate&&!o.dayName){try{const d=new Date(o.examDate+'T00:00:00');o.dayName=DAYS[d.getDay()]||''}catch(e){}}
      o.isRepeated=false;o.isAbsent=false;
      if('serial'in o&&!o.serial)o.serial=S.committees.length+1;
      S.committees.push(o);added++;
    });
    persist();closeModal();toast(`تم استيراد ${added} توزيع بنجاح`,'ok');logAction('import','committees',`استيراد ${added} توزيع لجنة من Excel`);
    draw();
  };
  render();
}

function importAccountsExcel(draw){
  const fi=$('#fileInput');
  fi.accept='.xlsx,.xls,.csv';
  fi.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;fi.value='';
    if(typeof XLSX==='undefined'){toast('مكتبة Excel غير محملة','e');return}
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){toast('الملف فارغ أو لا يحتوي على بيانات','e');return}
      let headerIdx=0;
      for(let i=0;i<Math.min(5,rows.length);i++){
        if(rows[i].some(c=>String(c).includes('التاريخ')||String(c).includes('عدد الطلاب'))){headerIdx=i;break}
      }
      const headers=rows[headerIdx].map(h=>String(h).trim());
      const dataRows=rows.slice(headerIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
      const formFields=CFG.accounts.fields().filter(f=>f.t!=='ro');
      const cleanH=h=>String(h).replace(/\s*\*+\s*$/,'').replace(/^\s*\*+\s*/,'').trim();
      const mapping=[];
      headers.forEach((h,i)=>{
        const ch=cleanH(h);
        const f=formFields.find(x=>x.label===ch||x.label===h||x.k===h||x.k===ch);
        mapping.push(f?f.k:null);
      });
      const parsed=dataRows.map((r,idx)=>{
        const o={_idx:idx,_errors:[]};
        mapping.forEach((k,i)=>{
          if(!k)return;
          const f=formFields.find(x=>x.k===k);
          let v=String(r[i]||'').trim();
          if(f.t==='number')o[k]=num(v);
          else if(f.t==='date')o[k]=v;
          else o[k]=v;
        });
        if(num(o.studentCount)&&!num(o.committeeCount)){const a=accRow(o.studentCount);o.committeeCount=a.com;if(!num(o.observerCount))o.observerCount=a.obs}
        return o;
      });
      reviewAccountsImport(parsed,formFields,draw);
    }catch(err){console.error(err);toast('خطأ في قراءة الملف: '+err.message,'e')}
  };
  fi.click();
}

      <td class="muted c">${i+1}</td>
      ${fields.map(f=>{
        let v=r[f.k]??'';
        const hasErr=r._errors.some(e=>e.includes(f.label));
        const errCls=hasErr?'err':'';
        if(f.t==='number')return`<td class="${errCls}"><input type="number" step="any" data-r="${i}" data-k="${f.k}" value="${esc(v)}"></td>`;
        if(f.t==='date')return`<td class="${errCls}"><input type="date" data-r="${i}" data-k="${f.k}" value="${esc(v)}"></td>`;
        return`<td class="${errCls}"><input data-r="${i}" data-k="${f.k}" value="${esc(v)}"></td>`;
      }).join('')}
      <td>${r._errors.length?`<span class="err-msg">${r._errors.map(e=>esc(e)).join('<br>')}</span>`:'<span class="badge p">✓ صالح</span>'}</td>
    </tr>`).join('')}</tbody></table></div>`;
    $('[data-s]',m.foot).disabled=(okRows===0);
    $('[data-s]',m.foot).textContent=`✓ اعتماد الاستيراد (${okRows} صف صالح)`;

    const el=e.target;if(el.dataset.r===undefined)return;
    const r=parsed[+el.dataset.r],k=el.dataset.key,f=fields.find(x=>x.k===k);
    if(f.t==='number')r[k]=num(el.value);
    else r[k]=el.value.trim();
    render();
  });

    render();
  });

        const ch=cleanH(h);
        const f=formFields.find(x=>x.label===ch||x.label===h||x.k===h||x.k===ch);
        mapping.push(f?f.k:null);
      });
      const parsed=dataRows.map((r,idx)=>{
        const o={_idx:idx,_errors:[]};
        mapping.forEach((k,i)=>{
          if(!k)return;
          const f=formFields.find(x=>x.k===k);
          let v=String(r[i]||'').trim();
          if(f.t==='number')o[k]=num(v);
          else if(f.t==='select'){
            const opts=typeof f.opts==='function'?f.opts():f.opts||[];
            if(k==='category'){const cat=catArr().find(c=>c.label===v||c.key===v);o[k]=cat?cat.key:''}
            else{const m=opts.find(x=>x===v);o[k]=m||v}
          }else o[k]=v;
        });
        return o;
      });
      reviewDuesImport(parsed,formFields,draw);
    }catch(err){console.error(err);toast('خطأ في قراءة الملف: '+err.message,'e')}
  };
  fi.click();
}

function reviewDuesImport(parsed,fields,draw){
  const m=openModal('مراجعة بيانات المستحقات المالية',`${parsed.length} صف. راجع البيانات ثم اضغط اعتماد.`,true);
  m.foot.innerHTML='<button class="btn" data-c>إلغاء</button><button class="btn pri" data-s>✓ اعتماد الاستيراد</button>';
  const existing=S.dues.map(d=>d.nationalId).filter(Boolean);
  const validate=()=>{
    let errCount=0;
    const seen={};
    parsed.forEach(r=>{
      r._errors=[];
      fields.forEach(f=>{
        if(f.req&&(r[f.k]===undefined||r[f.k]===''||r[f.k]===null))r._errors.push(`«${f.label}» مطلوب`);
      });
      if(r.nationalId){
        if(existing.includes(r.nationalId))r._errors.push('رقم قومي مسجل مسبقًا في المستحقات');
        if(seen[r.nationalId])r._errors.push('مكرر في الملف المستورد');
        seen[r.nationalId]=true;
      }
      if(!r.observerName&&!r.nationalId)r._errors.push('صف فارغ');
      if(r._errors.length)errCount++;
    });
    return errCount;
  };
  const render=()=>{
    const errCount=validate();
    const okRows=parsed.filter(r=>!r._errors.length).length;
    const bannerClass=errCount>0?'err':'ok';
    const bannerIcon=errCount>0?'⚠️':'✅';
    m.body.innerHTML=`<div class="stat-banner ${bannerClass}"><span><b>${bannerIcon}</b> ${parsed.length} صف • <b style="color:var(--ok)">${okRows}</b> صالح • <b style="color:var(--dst)">${errCount}</b> بخطأ</span>
      <span class="muted" style="font-size:11px">منع تكرار الرقم القومي تلقائيًا — يمكنك تعديل الخلايا ثم اعتماد الصفوف الصالحة</span></div>
    <div class="imp-review"><table><thead><tr><th>#</th>${fields.map(f=>`<th>${esc(f.label)}${f.req?' *':''}</th>`).join('')}<th>الحالة</th></tr></thead>
    <tbody>${parsed.map((r,i)=>`<tr>
      <td class="muted c">${i+1}</td>
      ${fields.map(f=>{
        let v=r[f.k]??'';
        const hasErr=r._errors.some(e=>e.includes(f.label)||e.includes('الرقم القومي')&&f.k==='nationalId');
        const errCls=hasErr?'err':'';
        if(f.t==='select'){const opts=typeof f.opts==='function'?f.opts():f.opts||[];if(f.k==='category'){return`<td class="${errCls}"><select data-r="${i}" data-k="${f.k}"><option value="">اختر</option>${catArr().map(c=>`<option value="${c.key}" ${c.key===v?'selected':''}>${esc(c.label)}</option>`).join('')}</select></td>`}return`<td class="${errCls}"><select data-r="${i}" data-k="${f.k}"><option value="">اختر</option>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></td>`}
        if(f.t==='number')return`<td class="${errCls}"><input type="number" step="any" data-r="${i}" data-k="${f.k}" value="${esc(v)}"></td>`;
        return`<td class="${errCls}"><input data-r="${i}" data-k="${f.k}" value="${esc(v)}"></td>`;
      }).join('')}
      <td>${r._errors.length?`<span class="err-msg">${r._errors.map(e=>esc(e)).join('<br>')}</span>`:'<span class="badge p">✓ صالح</span>'}</td>
    </tr>`).join('')}</tbody></table></div>`;
    $('[data-s]',m.foot).disabled=(okRows===0);
    $('[data-s]',m.foot).textContent=`✓ اعتماد الاستيراد (${okRows} صف صالح)`;
  };
  m.body.addEventListener('input',e=>{
    const el=e.target;if(el.dataset.r===undefined)return;
    const r=parsed[+el.dataset.r],k=el.dataset.key,f=fields.find(x=>x.k===k);
    if(f.t==='number')r[k]=num(el.value);
    else r[k]=el.value.trim();
    render();
  });
  m.body.addEventListener('change',e=>{
    const el=e.target;if(el.dataset.r===undefined)return;
    render();
  });
  $('[data-c]',m.foot).onclick=closeModal;
  $('[data-s]',m.foot).onclick=()=>{
    const errCount=validate();
    const valid=parsed.filter(r=>!r._errors.length);
    if(!valid.length){toast('لا توجد صفوف صالحة للاستيراد','e');return}
    if(errCount>0&&!confirm(`سيتم استيراد ${valid.length} صف صالح وتجاهل ${errCount} صف بخطأ. متابعة؟`))return;
    let added=0;
    valid.forEach(r=>{
      const o={id:uid()};
      fields.forEach(f=>{o[f.k]=r[f.k]!==undefined?r[f.k]:''});
      // auto-calc amount
      const cat=catObj(o.category);
      const rate=cat.rateType==='day'?num(st('workerRatePerDay')):cat.rateType==='percentage'?0:num(st('observerRatePerCommittee'));
      o.amount=num(o.committeeCount)*rate;
      if('serial'in o&&!o.serial)o.serial=S.dues.length+1;
      if(!('surplusCount'in o))o.surplusCount=0;
      if(!('actualCount'in o))o.actualCount=o.committeeCount;
      S.dues.push(o);added++;
    });
    persist();closeModal();toast(`تم استيراد ${added} مستحق بنجاح`,'ok');logAction('import','dues',`استيراد ${added} مستحق من Excel`);
    draw();
  };
  render();
}

/* ================= توزيع الملاحظين الزائدين ================= */
function distributeSurplusObservers(draw){
  const m=openModal('توزيع الملاحظين الزائدين','حدد العدد الإجمالي للزيادة ثم اختر طريقة التوزيع.',true);
  const generalDues=S.dues.filter(d=>d.category==='general'||d.category==='assistant');
  let surplusTotal=0;
  const render=()=>{
    const totalBase=generalDues.reduce((s,d)=>s+num(d.committeeCount),0);
    const totalSurplus=generalDues.reduce((s,d)=>s+num(d.surplusCount),0);
    const totalAll=totalBase+totalSurplus;
    m.body.innerHTML=`<div class="card" style="background:var(--mut);margin-bottom:12px">
      <div class="row" style="justify-content:space-between">
        <div><b>الملاحظون الحاليون:</b> ${generalDues.length}</div>
        <div><b>مجموع المراقب الأساسي:</b> ${fN(totalBase)}</div>
        <div><b>مجموع المراقب الموزع:</b> ${fN(totalSurplus)}</div>
        <div><b>الإجمالي بعد التوزيع:</b> ${fN(totalAll)}</div>
      </div>
    </div>
    <div class="fg">
      <div><label class="l">عدد الملاحظين الزائدين للتوزيع *</label><input type="number" id="surplusInput" value="${surplusTotal||''}" min="0" step="1" placeholder="مثال: 10"></div>
      <div><label class="l">طريقة التوزيع</label><select id="distMethod">
        <option value="even">توزيع متساوي على الجميع</option>
        <option value="proportional">توزيع نسبي حسب عدد المراقبات</option>
        <option value="manual">توزيع يدوي (تعديل فردي)</option>
      </select></div>
    </div>
    <div id="distPreview" style="margin-top:12px"></div>
    <div class="muted" style="font-size:11px;margin-top:8px">💡 التوزيع المتساوي يقسم العدد على جميع الملاحظين. التوزيع النسبي يعطي نصيب أكبر لمن لديه مراقبات أكثر. التوزيع اليدوي يتيح تعديل كل شخص فرديًا.</div>`;
    const updatePreview=()=>{
      const st1=num($('#surplusInput',m.body).value);
      const method=$('#distMethod',m.body).value;
      if(st1<=0||!generalDues.length){$('#distPreview',m.body).innerHTML='<p class="muted c">أدخل عددًا صحيحًا للتوزيع</p>';return}
      let distribution=[];
      if(method==='even'){
        const base=Math.floor(st1/generalDues.length);
        let rem=st1-base*generalDues.length;
        distribution=generalDues.map(d=>({id:d.id,name:d.observerName,base:d.committeeCount,add:base+(rem-->0?1:0)}));
      }else if(method==='proportional'){
        const total=generalDues.reduce((s,d)=>s+num(d.committeeCount),0)||1;
        let allocated=0;
        distribution=generalDues.map((d,i)=>{
          const share=i===generalDues.length-1?st1-allocated:Math.round(st1*num(d.committeeCount)/total);
          allocated+=share;
          return{id:d.id,name:d.observerName,base:d.committeeCount,add:share};
        });
      }else{
        distribution=generalDues.map(d=>({id:d.id,name:d.observerName,base:d.committeeCount,add:num(d.surplusCount)}));
      }
      let html=`<div class="imp-review"><table><thead><tr><th>الاسم</th><th>المراقب الأساسي</th><th>الزيادة الموزعة</th><th>الإجمالي</th></tr></thead><tbody>`;
      distribution.forEach(d=>{
        const total=d.base+d.add;
        html+=`<tr><td><b>${esc(d.name)}</b></td><td class="num">${fN(d.base)}</td><td class="num">${method==='manual'?`<input type="number" data-id="${d.id}" value="${d.add}" style="width:60px;text-align:center">`:`<b style="color:var(--warn)">${fN(d.add)}</b>`}</td><td class="num"><b>${fN(total)}</b></td></tr>`;
      });
      const sumBase=distribution.reduce((s,d)=>s+d.base,0);
      const sumAdd=distribution.reduce((s,d)=>s+d.add,0);
      html+=`<tr class="tot"><td>الإجمالي</td><td class="num">${fN(sumBase)}</td><td class="num">${fN(sumAdd)}</td><td class="num">${fN(sumBase+sumAdd)}</td></tr></tbody></table></div>`;
      $('#distPreview',m.body).innerHTML=html;
    };
    $('#surplusInput',m.body).addEventListener('input',updatePreview);
    $('#distMethod',m.body).addEventListener('change',updatePreview);
    updatePreview();
  };
  m.foot.innerHTML='<button class="btn" data-c>إلغاء</button><button class="btn pri" data-s>✓ اعتماد التوزيع</button>';
  $('[data-c]',m.foot).onclick=closeModal;
  $('[data-s]',m.foot).onclick=()=>{
    const st1=num($('#surplusInput',m.body).value);
    const method=$('#distMethod',m.body).value;
    if(st1<=0){toast('أدخل عددًا صحيحًا للزيادة','e');return}
    // Collect distribution
    const inputs=$$('input[data-id]',m.body);
    let distributed=0;
    if(method==='manual'){
      // Manual: read each input
      generalDues.forEach(d=>{
        const inp=inputs.find(i=>i.dataset.id===d.id);
        if(inp){
          const add=num(inp.value);
          d.surplusCount=add;
          const cat=catObj(d.category);
          const rate=cat.rateType==='day'?num(st('workerRatePerDay')):num(st('observerRatePerCommittee'));
          d.committeeCount=num(d.committeeCount); // keep base
          // recalc: base + surplus
          d.actualCount=num(d.committeeCount);
          d.amount=(num(d.committeeCount)+add)*rate;
          distributed+=add;
        }
      });
    }else{
      // Auto: even or proportional
      let distribution=[];
      if(method==='even'){
        const base=Math.floor(st1/generalDues.length);
        let rem=st1-base*generalDues.length;
        distribution=generalDues.map(d=>({id:d.id,add:base+(rem-->0?1:0)}));
      }else{
        const total=generalDues.reduce((s,d)=>s+num(d.committeeCount),0)||1;
        let allocated=0;
        distribution=generalDues.map((d,i)=>{
          const share=i===generalDues.length-1?st1-allocated:Math.round(st1*num(d.committeeCount)/total);
          allocated+=share;
          return{id:d.id,add:share};
        });
      }
      generalDues.forEach(d=>{
        const dist=distribution.find(x=>x.id===d.id);
        const add=dist?dist.add:0;
        d.surplusCount=add;
        const cat=catObj(d.category);
        const rate=cat.rateType==='day'?num(st('workerRatePerDay')):num(st('observerRatePerCommittee'));
        d.actualCount=num(d.committeeCount);
        d.amount=(num(d.committeeCount)+add)*rate;
        distributed+=add;
      });
    }
    persist();closeModal();toast(`تم توزيع ${distributed} ملاحظ زائد على ${generalDues.length} شخص`,'ok');logAction('distribute','dues',`توزيع ${distributed} ملاحظ زائد على ${generalDues.length} شخص (${method==='even'?'متساوي':method==='proportional'?'نسبي':'يدوي'})`);
    draw();
  };
  render();
}

/* ================= التصدير الرسمي للمستحقات المالية ================= */
function duesDoc(rows,tool){
  const general=rows.filter(r=>r.category==='general'||r.category==='assistant');
  const workers=rows.filter(r=>r.category==='workers');
  const others=rows.filter(r=>!['general','assistant','workers'].includes(r.category));
  const sec=(title,rs)=>{
    if(!rs.length)return '';
    let h=`<h2 style="margin:14px 0 6px">${esc(title)} (${rs.length})</h2>`;
    h+=`<table class="dt"><thead><tr><th>م</th><th>الاسم</th><th>الرقم القومي</th><th>المراقب الأساسي</th><th>الزيادة الموزعة</th><th>الإجمالي</th><th>المعدل</th><th>المبلغ</th><th>ملاحظات</th></tr></thead><tbody>`;
    rs.forEach((r,i)=>{
      const cat=catObj(r.category);
      const rate=cat.rateType==='day'?num(st('workerRatePerDay')):num(st('observerRatePerCommittee'));
      const total=num(r.committeeCount)+num(r.surplusCount);
      h+=`<tr><td class="n">${i+1}</td><td><b>${esc(r.observerName)}</b></td><td dir="ltr">${esc(r.nationalId||'-')}</td><td class="n">${num(r.committeeCount)}</td><td class="n">${num(r.surplusCount)}</td><td class="n"><b>${total}</b></td><td class="n">${fN(rate)} ج</td><td class="n"><b>${fN(r.amount)} ج</b></td><td>${esc(r.notes||'-')}</td></tr>`;
    });
    const sumBase=rs.reduce((s,r)=>s+num(r.committeeCount),0);
    const sumSurplus=rs.reduce((s,r)=>s+num(r.surplusCount),0);
    const sumTotal=sumBase+sumSurplus;
    const sumAmount=rs.reduce((s,r)=>s+num(r.amount),0);
    h+=`<tr class="tot"><td colspan="3">الإجمالي</td><td class="n">${fN(sumBase)}</td><td class="n">${fN(sumSurplus)}</td><td class="n">${fN(sumTotal)}</td><td></td><td class="n">${fN(sumAmount)} ج</td><td></td></tr></tbody></table>`;
    return h;
  };
  const totalBase=rows.reduce((s,r)=>s+num(r.committeeCount),0);
  const totalSurplus=rows.reduce((s,r)=>s+num(r.surplusCount),0);
  const totalAll=totalBase+totalSurplus;
  const totalAmount=rows.reduce((s,r)=>s+num(r.amount),0);
  const body=`${letter(true)}<div class="rt">المستحقات المالية للملاحظين</div>
  <div class="ib2"><div><b>الجامعة:</b>${esc(st('university'))}</div><div><b>الكلية:</b>${esc(st('faculty'))}</div><div><b>العام:</b>${esc(st('academicYear'))}</div><div><b>الفصل:</b>${esc(st('term'))}</div></div>
  ${sec('الملاحظون والهيئة المعاونة',general)}
  ${sec('العمال',workers)}
  ${others.length?sec('فئات أخرى',others):''}
  <div class="sm" style="margin-top:16px">
    <div style="font-weight:800;font-size:13pt;margin-bottom:8px;text-align:center;color:#2a7f5f">المجاميع النهائية</div>
    <div><span>مجموع مرات الملاحظة الأساسية</span><span>${fN(totalBase)}</span></div>
    <div><span>مجموع مرات الملاحظة الإضافية (الموزعة)</span><span>${fN(totalSurplus)}</span></div>
    <div style="border-top:1px solid #2a7f5f;margin-top:4px;padding-top:4px"><span><b>إجمالي مرات الملاحظة بعد التوزيع</b></span><span><b>${fN(totalAll)}</b></span></div>
    <div><span>إجمالي المستحقات المالية لجميع الملاحظين</span><span><b>${fN(totalAmount)} جنيه</b></span></div>
  </div>
  ${sigs()}<div class="ft">${esc(st('university'))} - ${esc(st('faculty'))} | قرار مجلس الجامعة رقم (${esc(st('decisionNumber'))}) بتاريخ ${esc(st('decisionDate'))}</div>`;
  return shell('المستحقات المالية',body,{land:true,tool});
}

    const key=$('#ctKey',m.body).value.trim().replace(/\s+/g,'_');
    if(!label||!key){toast('الاسم والمفتاح مطلوبان','e');return}
    if(isNew&&comTypesArr().some(x=>x.key===key)){toast('المفتاح موجود من قبل','e');return}
    const o={key,label,isCommittee:$('#ctIsCommittee',m.body).value==='true',color:$('#ctColor',m.body).value};

      S.committeeTypes[i]={...t,...o};
    }else{
      S.committeeTypes.push(o);

    persist();closeModal();redraw();toast(isNew?'تمت إضافة النوع':'تم تحديث النوع');
  };
}

/* ================= حساب المجاميع المستقلة ================= */
function controlTotals(){
  const types=comTypesArr();
  const result=[];
  let grand=0;
  // Group: Controls (control_1..4)
  const controlKeys=types.filter(t=>t.key.startsWith('control_')).map(t=>t.key);
  const controlRows=(S.control||[]).filter(c=>controlKeys.includes(c.committeeType));
  const controlTotal=controlRows.reduce((s,c)=>s+num(c.amount),0);
  result.push({label:'مجموع الكنترولات',value:controlTotal,count:controlRows.length,type:'controls',color:'#2a7f5f'});
  grand+=controlTotal;
  // Group: Preliminary
  const prelimRows=(S.control||[]).filter(c=>c.committeeType==='preliminary');
  const prelimTotal=prelimRows.reduce((s,c)=>s+num(c.amount),0);
  result.push({label:'مجموع اللجان التمهيدية',value:prelimTotal,count:prelimRows.length,type:'preliminary',color:'#e67e22'});
  grand+=prelimTotal;
  // Group: Higher
  const higherRows=(S.control||[]).filter(c=>c.committeeType==='higher');
  const higherTotal=higherRows.reduce((s,c)=>s+num(c.amount),0);
  result.push({label:'مجموع اللجان العليا',value:higherTotal,count:higherRows.length,type:'higher',color:'#e74c3c'});
  grand+=higherTotal;
  // Group: Observers (from dues)
  const observerRows=(S.dues||[]).filter(d=>d.category==='general'||d.category==='assistant');
  const observerTotal=observerRows.reduce((s,d)=>s+num(d.amount),0);
  result.push({label:'مجموع الملاحظين',value:observerTotal,count:observerRows.length,type:'observers',color:'#2a7f5f'});
  grand+=observerTotal;
  // Group: Workers
  const workerRows=(S.control||[]).filter(c=>c.committeeType==='workers');
  const workerTotal=workerRows.reduce((s,c)=>s+num(c.amount),0);
  result.push({label:'مجموع العمال',value:workerTotal,count:workerRows.length,type:'workers',color:'#3498db'});
  grand+=workerTotal;
  // Group: 6%
  const sixRows=(S.control||[]).filter(c=>c.committeeType==='6percent');
  const sixTotal=sixRows.reduce((s,c)=>s+num(c.amount),0);
  const sixCount=sixRows.reduce((s,c)=>s+num(c.committeeCount),0);
  result.push({label:'مجموع فئة 6%',value:sixTotal,count:sixRows.length,extra:'عدد اللجان: '+fN(sixCount),type:'6percent',color:'#9b59b6'});
  grand+=sixTotal;
  // Group: 9%
  const nineRows=(S.control||[]).filter(c=>c.committeeType==='9percent');
  const nineTotal=nineRows.reduce((s,c)=>s+num(c.amount),0);
  const nineCount=nineRows.reduce((s,c)=>s+num(c.committeeCount),0);
  result.push({label:'مجموع فئة 9%',value:nineTotal,count:nineRows.length,extra:'عدد اللجان: '+fN(nineCount),type:'9percent',color:'#f39c12'});
  grand+=nineTotal;
  result.push({label:'الإجمالي العام',value:grand,count:0,isGrand:true});
  return result;
}

function renderControlTotals(){
  const totals=controlTotals();
  let h=`<div class="card" style="margin-top:14px;background:var(--acc);border:2px solid var(--pri)"><h3>💰 المجاميع النهائية للكنترول واللجان</h3><div class="muted" style="margin-bottom:10px;font-size:12px">مجاميع مستقلة لكل فئة — اضغط على أي مجموعة لعرض التفاصيل</div>`;
  h+='<div class="totals-grid">';
  totals.forEach(t=>{
    const clickAttr=t.type?`data-goto="${t.type}"`:'';
    h+=`<div class="totals-card ${t.isGrand?'grand':'clickable'}" ${clickAttr} style="${t.color&&!t.isGrand?`border-color:${t.color}40`:''}">
      <div class="tc-label">${esc(t.label)}</div>
      <div class="tc-value">${fN(t.value)} ج</div>
      <div class="tc-count">${t.isGrand?'إجمالي جميع البنود':`${t.count} سجل${t.extra?' • '+esc(t.extra):''}`}</div>
    </div>`;
  });
  h+='</div></div>';
  return h;
}

// Combined export for all control data
function exportControlCombined(kind){
  const types=comTypesArr();
  const allRows=[];
  const sections=[];
  let grandTotal=0;
  types.forEach(t=>{
    const rows=(S.control||[]).filter(c=>c.committeeType===t.key);
    if(!rows.length)return;
    const total=rows.reduce((s,c)=>s+num(c.amount),0);
    grandTotal+=total;
    sections.push({type:t.key,label:t.label,rows,total,count:rows.length});
    rows.forEach(r=>allRows.push(r));
  });
  if(!allRows.length){toast('لا توجد بيانات للتصدير','e');return}
  const title='تقرير شامل للكنترول واللجان';
  const cols=['م','الاسم','الرقم القومي','اللجنة/الفئة','الصفة','عدد اللجان','المبلغ','ملاحظات'];
  const data=[['م','الاسم','الرقم القومي','اللجنة/الفئة','الصفة','عدد اللجان','المبلغ','ملاحظات']];
  sections.forEach(sec=>{
    data.push([`=== ${sec.label} ===`,'','','','','','','']);
    sec.rows.forEach((r,i)=>{
      data.push([i+1,r.name||'-',r.nationalId||'-',sec.label,r.role||'-',r.committeeCount||'-',num(r.amount),r.notes||'-']);
    });
    data.push(['','','','','','الإجمالي',num(sec.total),'']);
    data.push([]);
  });
  data.push(['','','','','','الإجمالي العام',num(grandTotal),'']);
  
  if(kind==='xlsx'){
    if(typeof XLSX==='undefined'){toast('مكتبة Excel غير محملة','e');return}
    const ws=XLSX.utils.aoa_to_sheet(data);
    ws['!cols']=[{wch:5},{wch:25},{wch:18},{wch:20},{wch:12},{wch:10},{wch:12},{wch:20}];
    ws['!rtl']=true;
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'الكنترول واللجان');
    XLSX.writeFile(wb,'تقرير_شامل_الكنترول_واللجان.xlsx');
    return;
  }
  if(kind==='csv'){
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const csv=data.map(r=>r.map(q).join(',')).join('\r\n');
    return dlBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'تقرير_شامل_الكنترول_واللجان.csv');
  }
  // Word/PDF/print - build HTML doc
  let body=`${letter(false)}<div class="tb"><h1>${esc(title)}</h1><div class="tl">${esc(st('term'))} ${esc(st('academicYear'))}</div></div>`;
  sections.forEach(sec=>{
    body+=`<h2 style="margin:14px 0 6px;color:${comTypeColor(sec.type)}">${esc(sec.label)} <span style="font-size:12px;color:#555">(${sec.count} سجل)</span></h2>`;
    body+=`<table><thead><tr><th>م</th><th>الاسم</th><th>الرقم القومي</th><th>الصفة</th><th>عدد اللجان</th><th>المبلغ</th><th>ملاحظات</th></tr></thead><tbody>`;
    sec.rows.forEach((r,i)=>{
      body+=`<tr><td>${i+1}</td><td>${esc(r.name||'-')}</td><td dir="ltr">${esc(r.nationalId||'-')}</td><td>${esc(r.role||'-')}</td><td>${r.committeeCount||'-'}</td><td>${fN(num(r.amount))} ج</td><td>${esc(r.notes||'-')}</td></tr>`;
    });
    body+=`<tr class="tot"><td colspan="5">إجمالي ${esc(sec.label)}</td><td>${fN(sec.total)} ج</td><td></td></tr></tbody></table>`;
  });
  // Grand totals summary
  const totals=controlTotals();
  body+=`<div class="sm" style="margin-top:16px"><h3 style="margin-bottom:8px">المجاميع النهائية</h3>`;
  totals.forEach(t=>{
    body+=`<div><span>${esc(t.label)}${t.extra?' ('+esc(t.extra)+')':''}</span><span>${fN(t.value)} ج</span></div>`;
  });
  body+=`</div>${sigs()}${decFoot()}`;
  const html=shell(title,body,{land:true,tool:kind!=='print'});
  if(kind==='print')return printHTML(shell(title,body,{land:true}));
  if(kind==='pdf')return printHTML(html);
  if(kind==='word'){const h=html.replace('<html lang="ar" dir="rtl">','<html lang="ar" dir="rtl" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">');return dlBlob(new Blob(['\ufeff',h],{type:'application/msword;charset=utf-8'}),'تقرير_شامل_الكنترول_واللجان.doc')}
  if(kind==='html')return dlBlob(new Blob([html],{type:'text/html;charset=utf-8'}),'تقرير_شامل_الكنترول_واللجان.html');
}

function accRow(stu){const s=num(st('studentsPerCommittee')),o=num(st('observersPerCommittee'));const com=flr(num(stu)/(s>0?s:25));return{com,obs:com*(o>0?o:2)}}
function accCalc(rows){
  const stu=rows.reduce((s,o)=>s+num(o.studentCount),0),com=rows.reduce((s,o)=>s+num(o.committeeCount),0),obs=rows.reduce((s,o)=>s+num(o.observerCount),0);

  const ten=flr(obs*ap/100),withTen=obs+ten,nine=flr(withTen*np/100),six=flr(withTen*sp/100),grand=withTen+nine+six;

}

  const pv=()=>{const g=k=>($(`[data-s="${k}"]`)||{}).value||'';$('#pv1').textContent=g('universityEnglish');$('#pv2').textContent=g('university');$('#pv3').textContent=g('faculty');$('#pv4').textContent=`${g('term')} ${g('academicYear')} — ${g('department')} | قرار مجلس الجامعة رقم (${g('decisionNumber')}) بتاريخ ${g('decisionDate')}`};pv();$$('[data-s]').forEach(i=>i.addEventListener('input',pv));

  $$('[data-logo-del]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.logoDel;

      S.settings[key]=arr;
      persist();
      redrawFlexList(key);
      inp&&inp.focus();
      return;
    }
    const delBtn=e.target.closest('[data-fl-del]');
    if(delBtn){
      const key=delBtn.closest('[data-fl]').dataset.fl;
      const idx=+delBtn.dataset.flDel;
      const arr=readFlexList(key);
      arr.splice(idx,1);
      S.settings[key]=arr;
      persist();
      redrawFlexList(key);
      return;
    }
    const upBtn=e.target.closest('[data-fl-up]');
    if(upBtn){
      const key=upBtn.closest('[data-fl]').dataset.fl;
      const idx=+upBtn.dataset.flUp;
      if(idx===0)return;
      const arr=readFlexList(key);
      [arr[idx-1],arr[idx]]=[arr[idx],arr[idx-1]];
      S.settings[key]=arr;
      persist();
      redrawFlexList(key);
      return;
    }
    const dnBtn=e.target.closest('[data-fl-dn]');
    if(dnBtn){

      const idx=+dnBtn.dataset.flDn;

      persist();
      redrawFlexList(key);

  // Live save edits on flex list inputs (blur)
  $('#main').addEventListener('change',e=>{

  };
  const sgDraw=()=>{
    const arr=sigList();
    $('#sgBox').innerHTML=`<div class="flex-list">${arr.map((g,i)=>`<div class="sg-row" data-sgi="${i}">

    sgPrev();

  const sgSave=()=>{S.settings.signatures=sgRead();persist()};
  $('#sgBox').addEventListener('change',e=>{
    if(!e.target.dataset.sg)return;

const SECS=[['dashboard','لوحة التحكم','📊','نظرة عامة وإحصائيات',renderDashboard],['observers','الملاحظون','👥','قاعدة بيانات الموظفين',()=>crud(CFG.observers)],['subjects','المواد والامتحانات','📚','جدولة الامتحانات',()=>crud(CFG.subjects)],['committees','توزيع اللجان','📋','توزيع الملاحظين',()=>crud(CFG.committees)],['control','الكنترول واللجان','🛡️','تشكيل اللجان والكنترولات',()=>crud(CFG.control)],['workers','العمال','👷','قسم العمال والمستحقين',()=>crud(CFG.workers)],['sixpercent','فئة 6%','📊','فئة 6% المستقلة',()=>crud(CFG.sixPercent)],['ninepercent','فئة 9%','📈','فئة 9% المستقلة',()=>crud(CFG.ninePercent)],['accounts','الحساب المرسل','🏛️','الحساب المرسل للجامعة',()=>crud(CFG.accounts)],['dues','المستحقات المالية','💰','مستحقات الملاحظين',()=>crud(CFG.dues)],['reports','التقارير','📑','اليومي وأعمال الامتحانات',renderReports],['auditlog','سجل التعديلات','📜','تتبع جميع العمليات',renderAuditLog],['settings','الإعدادات','⚙️','البيانات الأساسية',renderSettings]];
function renderReports(){
  $('#main').innerHTML='<div class="tabs"><button data-t="d" class="on">التقرير اليومي للامتحانات</button><button data-t="w">أعمال الامتحانات والمكافآت</button></div><div id="rep"></div>';
  const show=t=>{$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));crud(t==='d'?CFG.dailyReports:CFG.workReports,$('#rep'))};
  $('.tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)show(b.dataset.t)};show('d');
}
let cur='dashboard';
function go(k){if(!SECS.find(s=>s[0]===k))k='dashboard';cur=k;closeModal();const s=SECS.find(x=>x[0]===k);
  $('#nav').innerHTML=SECS.map(x=>`<button class="nb ${x[0]===k?'on':''}" data-k="${x[0]}"><span class="ic">${x[2]}</span><span><b>${x[1]}</b><small>${x[3]}</small></span></button>`).join('');
  $('#nav').classList.remove('open');history.replaceState(null,'','#'+k);
  $('#main').innerHTML='';const head=document.createElement('div');head.innerHTML=`<h2 class="pt">${s[1]}</h2><div class="pd">${s[3]}</div>`;
  s[4]();$('#main').prepend(head);window.scrollTo(0,0)}
function chrome(){$('#hSub').textContent=`${st('university')} - ${st('faculty')}`;$('#hTerm').textContent=`${st('term')} ${st('academicYear')}`;
  const logoBox=$('#appLogo');
  const uLogo=st('universityLogo');
  if(uLogo){logoBox.innerHTML=`<img src="${esc(uLogo)}" alt="شعار" style="width:100%;height:100%;object-fit:contain;border-radius:9px">`;logoBox.style.background='transparent'}
  else{logoBox.textContent='🎓';logoBox.style.background='var(--pri)'}
  $('#foot').innerHTML=`<span>${esc(st('university'))} - ${esc(st('faculty'))} | ${esc(st('term'))} ${esc(st('academicYear'))}</span><span>قرار مجلس الجامعة رقم (${esc(st('decisionNumber'))}) بتاريخ ${esc(st('decisionDate'))}</span>`}
function setTheme(d){document.body.classList.toggle('dark',d);document.documentElement.classList.toggle('dark',d);$('#themeBtn').textContent=d?'☀️':'🌙';try{localStorage.setItem(THEME,d?'1':'0')}catch(e){}}
document.addEventListener('DOMContentLoaded',()=>{
  load();chrome();
  let dk=false;try{dk=localStorage.getItem(THEME)==='1'}catch(e){}setTheme(dk);
  $('#themeBtn').onclick=()=>setTheme(!document.body.classList.contains('dark'));
  $('#menuBtn').onclick=()=>$('#nav').classList.toggle('open');
  $('#nav').onclick=e=>{const b=e.target.closest('[data-k]');if(b)go(b.dataset.k)};
  $('#roleBtn').onclick=()=>{
    if(isAdmin()){currentRole='user';updateRoleBtn();toast('تم الخروج من وضع المدير');return}
    promptAdmin(()=>{},'تفعيل صلاحية المدير للوصول إلى إدارة الفئات والحقول والحذف.');
  };
  // Escape key closes modals
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#mroot').innerHTML.trim())closeModal()});
  updateRoleBtn();
  go(location.hash.slice(1)||'dashboard');
});
</script>
</body>
